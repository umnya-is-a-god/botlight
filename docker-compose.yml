x-logging:
      &default-logging
      driver: "json-file"
      options:
          max-size: "200k"
          max-file: "10"

networks:
    default:
        ipam:
            config:
                - subnet: 10.10.0.0/24
    xray:
        ipam:
            config:
                - subnet: 10.10.1.0/24
volumes:
    adguard:
    warp:

services:
    up:
        image: botlight/vpnbot-ng:local
        pull_policy: build
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - MKNOD
            - SETFCAP
            - SETPCAP
            - FSETID
            - NET_RAW
        build:
            context: dockerfile
            dockerfile: nginx.dockerfile
            args:
                image: ${IMAGE}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./config/upstream.conf:/etc/nginx/nginx.conf:ro
            - ./config/deny:/etc/nginx/deny:ro
            - ./scripts/start_upstream.sh:/start_upstream.sh:ro
            - ./sshpub:/ssh:ro
            - ./config/sshd_config:/etc/ssh/sshd_config:ro
            - ./logs/:/logs/
        ports:
            - 443:443/tcp
            - 443:443/udp
        hostname: upstream
        container_name: upstream-${VER}
        depends_on:
            ng:
                condition: service_healthy
            xr:
                condition: service_started
            oc:
                condition: service_started
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_upstream.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.10
        logging: *default-logging
    ng:
        image: botlight/vpnbot-ng:local
        pull_policy: build
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - MKNOD
            - SETFCAP
            - SETPCAP
            - FSETID
            - NET_RAW
        build:
            context: dockerfile
            dockerfile: nginx.dockerfile
            args:
                image: ${IMAGE}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./config/override.conf:/etc/nginx/override.conf:ro
            - ./config/location.conf:/etc/nginx/location.conf:ro
            - ./config/nginx_default.conf:/nginx_default.conf:ro
            - ./scripts/start_ng.sh:/start_ng.sh:ro
            - ./certs/:/certs/:ro
            - ./sshpub:/ssh:ro
            - ./config/sshd_config:/etc/ssh/sshd_config:ro
            - ./logs/:/logs/
            - ./app/webapp:/app:ro
        ports:
            - 80:80
        hostname: nginx
        container_name: nginx-${VER}
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_ng.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.2
            xray:
                ipv4_address: 10.10.1.2
        logging: *default-logging
        depends_on:
            php:
                condition: service_healthy
            ad:
                condition: service_started
            xr:
                condition: service_started
        healthcheck:
            test: ["CMD", "nginx", "-t"]
            interval: 10s
            timeout: 5s
            retries: 3
    php:
        image: botlight/vpnbot-php:local
        pull_policy: build
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - MKNOD
            - SETFCAP
            - SETPCAP
            - FSETID
            - NET_RAW
        build:
            dockerfile: dockerfile/php.dockerfile
            args:
                image: ${IMAGE}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./config/php.ini:/etc/php83/php.ini:ro
            - ./config/php-fpm.conf:/etc/php83/php-fpm.d/www.conf:ro
            - ./config/:/config/
            - ./certs/:/certs/
            - ./ssh:/ssh
            - ./sshpub:/sshpub
            - ./app:/app
            - ./logs/:/logs/
            - ./scripts/start_php.sh:/start_php.sh:ro
            - ./scripts/check_file.sh:/check_file.sh:ro
            - ./mirror:/mirror
            - ./.env:/mirror/.env:ro
            - ./update:/update
            - ./.git:/.git:ro
            - warp:/etc/warp
        environment:
            IP: ${IP}
            VER: ${VER}
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        hostname: php
        container_name: php-${VER}
        # restart: unless-stopped
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_php.sh"]
        working_dir: /app
        networks:
            default:
                ipv4_address: 10.10.0.7
        extra_hosts:
            - "host.docker.internal:host-gateway"
        logging: *default-logging
        healthcheck:
            test: ["CMD", "/bin/sh", "/check_file.sh"]
            interval: 5s
            timeout: 5s
            retries: 5
    service:
        image: botlight/vpnbot-php:local
        pull_policy: build
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - MKNOD
            - SETFCAP
            - SETPCAP
            - FSETID
            - NET_RAW
        build:
            dockerfile: dockerfile/php.dockerfile
            args:
                image: ${IMAGE}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./config/php.ini:/etc/php83/php.ini:ro
            - ./config/:/config/
            - ./certs/:/certs/
            - ./ssh:/ssh:ro
            - ./app:/app
            - ./logs/:/logs/
            - ./update:/update
            - ./.git:/.git:ro
            - ./scripts/start_service.sh:/start_service.sh:ro
        environment:
            IP: ${IP}
            VER: ${VER}
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        hostname: service
        container_name: service-${VER}
        # restart: unless-stopped
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_service.sh"]
        working_dir: /app
        networks:
            default:
                ipv4_address: 10.10.0.15
        logging: *default-logging
        depends_on:
            - up
            - ng
            - php
            - ad
            - xr
            - oc
            - dnstt
    ad:
        image: botlight/vpnbot-ad:local
        pull_policy: build
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - MKNOD
            - SETFCAP
            - SETPCAP
            - FSETID
            - NET_RAW
        build:
            dockerfile: dockerfile/adguard.dockerfile
            args:
                image: ${IMAGE}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - type: volume
              target: /opt/adguardhome/work
              source: adguard
            - ./sshpub:/ssh:ro
            - ./config/sshd_config:/etc/ssh/sshd_config:ro
            - ./config/:/config/
            - ./certs/:/certs/:ro
            - ./logs/:/logs/
            - ./scripts/start_ad.sh:/start_ad.sh:ro
        hostname: adguard
        container_name: adguard-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        networks:
            default:
                ipv4_address: 10.10.0.5
        cap_add:
            - NET_ADMIN
        entrypoint: ["/bin/sh", "/start_ad.sh"]
        logging: *default-logging
    xr:
        image: botlight/vpnbot-xr:local
        pull_policy: build
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - MKNOD
            - SETFCAP
            - SETPCAP
            - FSETID
            - NET_RAW
        build:
            dockerfile: dockerfile/xray.dockerfile
            args:
                image: ${IMAGE}
                xray_version: ${XRAY_VERSION}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./sshpub:/ssh:ro
            - ./config/sshd_config:/etc/ssh/sshd_config:ro
            - ./config/xray.json:/xray.json:ro
            - ./scripts/start_xray.sh:/start_xray.sh:ro
            - ./logs:/logs
        hostname: xray
        container_name: xray-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_xray.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.9
            xray:
                ipv4_address: 10.10.1.9
        logging: *default-logging
    oc:
        image: botlight/vpnbot-oc:local
        pull_policy: build
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - MKNOD
            - SETFCAP
            - SETPCAP
            - FSETID
        build:
            dockerfile: dockerfile/ocserv.dockerfile
            args:
                image: ${IMAGE}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./sshpub:/ssh:ro
            - ./config/sshd_config:/etc/ssh/sshd_config:ro
            - ./config:/etc/ocserv
            - ./certs:/certs:ro
            - ./scripts/start_oc.sh:/start_oc.sh:ro
        hostname: ocserv
        container_name: openconnect-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_oc.sh"]
        cap_add:
            - NET_ADMIN
        devices:
            - /dev/net/tun:/dev/net/tun
        networks:
            default:
                ipv4_address: 10.10.0.11
        logging: *default-logging
    wp:
        image: botlight/vpnbot-wg:local
        pull_policy: build
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - MKNOD
            - SETFCAP
            - SETPCAP
            - FSETID
        build:
            dockerfile: dockerfile/wireguard.dockerfile
            args:
                image: ${IMAGE}
        cap_add:
            - NET_ADMIN
        sysctls:
            - net.ipv4.conf.all.src_valid_mark=1
        devices:
            - /dev/net/tun:/dev/net/tun
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./sshpub:/ssh:ro
            - ./config/sshd_config:/etc/ssh/sshd_config:ro
            - ./config/pac.json:/config/pac.json:ro
            - ./scripts/start_wp.sh:/start_wp.sh:ro
            - warp:/etc/warp
        hostname: warp
        container_name: warp-${VER}
        command: ["/bin/sh", "/start_wp.sh"]
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        working_dir: /etc/warp
        networks:
            default:
                ipv4_address: 10.10.0.13
        logging: *default-logging
    dnstt:
        image: botlight/vpnbot-dnstt:local
        pull_policy: build
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - MKNOD
            - SETFCAP
            - SETPCAP
            - FSETID
            - NET_RAW
        build:
            dockerfile: dockerfile/dnstt.dockerfile
            args:
                image: ${IMAGE}
        volumes:
            - ./config/.profile:/root/.ashrc:ro
            - ./sshpub:/ssh:ro
            - ./logs:/logs
            - ./config/sshd_config:/etc/ssh/sshd_config:ro
            - ./config/dnstt:/dnstt
            - ./scripts/start_dnstt.sh:/start_dnstt.sh:ro
        hostname: dnstt
        container_name: dnstt-${VER}
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/start_dnstt.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.16
        logging: *default-logging