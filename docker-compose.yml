x-logging:
      &default-logging
      driver: "json-file"
      options:
          max-size: "200k"
          max-file: "10"

networks:
    default:
        ipam:
            config:
                - subnet: 10.10.0.0/24
    xray:
        ipam:
            config:
                - subnet: 10.10.1.0/24
volumes:
    adguard:
    warp:

services:
    up:
        # built on GitHub (scripts/images.sh), or here from the build section below
        image: ${IMAGES:-ghcr.io/umnya-is-a-god/botlight}-ng:${IMAGE_TAG:-main}
        security_opt:
            - no-new-privileges:true
        # nothing by default, only what the container needs
        cap_drop:
            - ALL
        cap_add:
            # sshd (the bot's commands): privilege separation, its children
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID
            - SYS_CHROOT
            - KILL
            - NET_BIND_SERVICE
        mem_limit: 128m
        pids_limit: 200
        build:
            context: dockerfile
            dockerfile: nginx.dockerfile
            args:
                image: ${IMAGE}
        volumes:
            # shell profile, sshd and php configs; start scripts (read-only)
            - ./system:/system:ro
            - ./scripts:/scripts:ro
            # a folder, not single files: the bot replaces them by rename
            - ./data/up:/etc/nginx/bot:ro
            - ./sshpub:/ssh:ro
            - ./sshhost/up:/etc/ssh/pinned:ro
            - ./logs/:/logs/
        ports:
            - 443:443/tcp
        hostname: upstream
        container_name: upstream-${VER}
        restart: unless-stopped
        depends_on:
            ng:
                condition: service_healthy
            xr:
                condition: service_started
            oc:
                condition: service_started
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/scripts/start_upstream.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.10
        logging: *default-logging
    ng:
        # built on GitHub (scripts/images.sh), or here from the build section below
        image: ${IMAGES:-ghcr.io/umnya-is-a-god/botlight}-ng:${IMAGE_TAG:-main}
        security_opt:
            - no-new-privileges:true
        # nothing by default, only what the container needs
        cap_drop:
            - ALL
        cap_add:
            # sshd (the bot's commands): privilege separation, its children
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID
            - SYS_CHROOT
            - KILL
            - NET_BIND_SERVICE
        mem_limit: 256m
        pids_limit: 300
        build:
            context: dockerfile
            dockerfile: nginx.dockerfile
            args:
                image: ${IMAGE}
        volumes:
            # shell profile, sshd and php configs; start scripts (read-only)
            - ./system:/system:ro
            - ./scripts:/scripts:ro
            - ./data/ng:/etc/nginx/bot:ro
            - ./data/www:/www:ro
            # Let's Encrypt challenges (certbot in php/service writes them)
            - ./data/acme:/acme:ro
            # override.conf and location.conf (your own nginx includes)
            - ./config:/etc/nginx/user:ro
            - ./certs/:/certs/:ro
            - ./sshpub:/ssh:ro
            - ./sshhost/ng:/etc/ssh/pinned:ro
            - ./logs/:/logs/
            - ./app/webapp:/app:ro
        ports:
            - 80:80
        hostname: nginx
        container_name: nginx-${VER}
        restart: unless-stopped
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/scripts/start_ng.sh"]
        networks:
            default:
                ipv4_address: 10.10.0.2
            xray:
                ipv4_address: 10.10.1.2
        logging: *default-logging
        depends_on:
            php:
                condition: service_healthy
            ad:
                condition: service_started
            xr:
                condition: service_started
        healthcheck:
            test: ["CMD", "nginx", "-t", "-q", "-c", "/etc/nginx/bot/nginx.conf"]
            interval: 10s
            timeout: 5s
            retries: 3
    php:
        # built on GitHub (scripts/images.sh), or here from the build section below
        image: ${IMAGES:-ghcr.io/umnya-is-a-god/botlight}-php:${IMAGE_TAG:-main}
        security_opt:
            - no-new-privileges:true
        # nothing by default: php-fpm starts its pools as other users, the
        # bot sets file groups in ./data
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID
            - KILL
        mem_limit: 1g
        pids_limit: 400
        build:
            dockerfile: dockerfile/php.dockerfile
            args:
                image: ${IMAGE}
        volumes:
            # shell profile, sshd and php configs; start scripts (read-only)
            - ./system:/system:ro
            - ./scripts:/scripts:ro
            # templates only: the working state is in ./data
            - ./config/:/config/:ro
            - ./data:/data
            - ./certs/:/certs/
            # certbot: account and certificate lineages, challenge files
            - ./data/letsencrypt:/etc/letsencrypt
            - ./data/acme:/acme
            - ./ssh:/ssh
            - ./sshpub:/sshpub
            - ./sshhost:/sshhost
            # the bot's code: read-only, so a web pool cannot change it
            # (override.php is loaded from here too)
            - ./app:/app:ro
            - ./logs/:/logs/
            - ./mirror:/mirror:ro
            - ./update:/update
            - ./.git:/.git:ro
            - warp:/etc/warp
        environment:
            IP: ${IP}
            VER: ${VER}
            # php.ini from ./system
            PHPRC: /system
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        hostname: php
        container_name: php-${VER}
        restart: unless-stopped
        stop_grace_period: 1s
        command: ["/bin/sh", "/scripts/start_php.sh"]
        working_dir: /app
        networks:
            default:
                ipv4_address: 10.10.0.7
        logging: *default-logging
        # the bot's polling loop touches /tmp/heartbeat on every round
        healthcheck:
            test: ["CMD", "/bin/sh", "/scripts/check_file.sh", "120", "/tmp/heartbeat"]
            interval: 5s
            timeout: 5s
            retries: 5
    service:
        # built on GitHub (scripts/images.sh), or here from the build section below
        image: ${IMAGES:-ghcr.io/umnya-is-a-god/botlight}-php:${IMAGE_TAG:-main}
        security_opt:
            - no-new-privileges:true
        # nothing by default, only what the container needs
        cap_drop:
            - ALL
        cap_add:
            # sshd (the bot's commands): privilege separation, its children
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID
            - SYS_CHROOT
            - KILL
            - NET_BIND_SERVICE
        mem_limit: 512m
        pids_limit: 300
        build:
            dockerfile: dockerfile/php.dockerfile
            args:
                image: ${IMAGE}
        volumes:
            # shell profile, sshd and php configs; start scripts (read-only)
            - ./system:/system:ro
            - ./scripts:/scripts:ro
            - ./config/:/config/:ro
            - ./data:/data
            - ./certs/:/certs/
            # certbot: account and certificate lineages, challenge files
            - ./data/letsencrypt:/etc/letsencrypt
            - ./data/acme:/acme
            - ./ssh:/ssh:ro
            - ./sshhost/service:/etc/ssh/pinned:ro
            - ./app:/app:ro
            - ./logs/:/logs/
            - ./update:/update
            - ./.git:/.git:ro
        environment:
            IP: ${IP}
            VER: ${VER}
            # php.ini from ./system
            PHPRC: /system
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        hostname: service
        container_name: service-${VER}
        restart: unless-stopped
        stop_grace_period: 1s
        command: ["/bin/sh", "/scripts/start_service.sh"]
        working_dir: /app
        # the cron loop and the IP limit loop touch their heartbeat files
        healthcheck:
            test: ["CMD", "/bin/sh", "/scripts/check_file.sh", "300", "/tmp/cron_heartbeat", "/tmp/iplimit_heartbeat"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 120s
        networks:
            default:
                ipv4_address: 10.10.0.15
        logging: *default-logging
        depends_on:
            - up
            - ng
            - php
            - ad
            - xr
            - oc
            - dnstt
    ad:
        # built on GitHub (scripts/images.sh), or here from the build section below
        image: ${IMAGES:-ghcr.io/umnya-is-a-god/botlight}-ad:${IMAGE_TAG:-main}
        security_opt:
            - no-new-privileges:true
        # nothing by default, only what the container needs
        cap_drop:
            - ALL
        cap_add:
            # sshd (the bot's commands): privilege separation, its children
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID
            - SYS_CHROOT
            - KILL
            - NET_BIND_SERVICE
            - NET_ADMIN
        mem_limit: 1g
        pids_limit: 300
        build:
            dockerfile: dockerfile/adguard.dockerfile
            args:
                image: ${IMAGE}
        volumes:
            # shell profile, sshd and php configs; start scripts (read-only)
            - ./system:/system:ro
            - ./scripts:/scripts:ro
            - type: volume
              target: /opt/adguardhome/work
              source: adguard
            - ./sshpub:/ssh:ro
            - ./sshhost/ad:/etc/ssh/pinned:ro
            # AdGuard's own config only (AdGuard rewrites it from its panel)
            - ./data/adguard:/config
            - ./certs/:/certs/:ro
            - ./logs/:/logs/
        hostname: adguard
        container_name: adguard-${VER}
        restart: unless-stopped
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        networks:
            default:
                ipv4_address: 10.10.0.5
        entrypoint: ["/bin/sh", "/scripts/start_ad.sh"]
        logging: *default-logging
    xr:
        # built on GitHub (scripts/images.sh), or here from the build section below
        image: ${IMAGES:-ghcr.io/umnya-is-a-god/botlight}-xr:${IMAGE_TAG:-main}
        security_opt:
            - no-new-privileges:true
        # nothing by default, only what the container needs
        cap_drop:
            - ALL
        cap_add:
            # sshd (the bot's commands): privilege separation, its children
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID
            - SYS_CHROOT
            - KILL
            - NET_BIND_SERVICE
            - NET_ADMIN
        mem_limit: 1g
        pids_limit: 500
        build:
            dockerfile: dockerfile/xray.dockerfile
            args:
                image: ${IMAGE}
                xray_version: ${XRAY_VERSION}
        volumes:
            # shell profile, sshd and php configs; start scripts (read-only)
            - ./system:/system:ro
            - ./scripts:/scripts:ro
            - ./sshpub:/ssh:ro
            - ./sshhost/xr:/etc/ssh/pinned:ro
            - ./data/xray:/xray:ro
            - ./logs:/logs
        hostname: xray
        container_name: xray-${VER}
        restart: unless-stopped
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/scripts/start_xray.sh"]
        # iptables: egress filter for client traffic (start_xray.sh): NET_ADMIN
        networks:
            default:
                ipv4_address: 10.10.0.9
            xray:
                ipv4_address: 10.10.1.9
        logging: *default-logging
    oc:
        # built on GitHub (scripts/images.sh), or here from the build section below
        image: ${IMAGES:-ghcr.io/umnya-is-a-god/botlight}-oc:${IMAGE_TAG:-main}
        security_opt:
            - no-new-privileges:true
        # nothing by default, only what the container needs
        cap_drop:
            - ALL
        cap_add:
            # sshd (the bot's commands): privilege separation, its children
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID
            - SYS_CHROOT
            - KILL
            - NET_BIND_SERVICE
            - NET_ADMIN
            - NET_RAW
        mem_limit: 256m
        pids_limit: 300
        build:
            dockerfile: dockerfile/ocserv.dockerfile
            args:
                image: ${IMAGE}
        volumes:
            # shell profile, sshd and php configs; start scripts (read-only)
            - ./system:/system:ro
            - ./scripts:/scripts:ro
            - ./sshpub:/ssh:ro
            - ./sshhost/oc:/etc/ssh/pinned:ro
            # ocserv.conf and ocserv.passwd (the bot writes both)
            - ./data/ocserv:/etc/ocserv:ro
            # the traffic of ended sessions (scripts/oc_disconnect.sh)
            - ./data/octraffic:/octraffic
            - ./certs:/certs:ro
        # DTLS straight to ocserv: the TCP side comes through upstream with
        # the proxy protocol, which ocserv takes on TCP only
        ports:
            - 443:443/udp
        hostname: ocserv
        container_name: openconnect-${VER}
        restart: unless-stopped
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/scripts/start_oc.sh"]
        devices:
            - /dev/net/tun:/dev/net/tun
        networks:
            default:
                ipv4_address: 10.10.0.11
        logging: *default-logging
    wp:
        # built on GitHub (scripts/images.sh), or here from the build section below
        image: ${IMAGES:-ghcr.io/umnya-is-a-god/botlight}-wg:${IMAGE_TAG:-main}
        security_opt:
            - no-new-privileges:true
        # nothing by default, only what the container needs
        cap_drop:
            - ALL
        cap_add:
            # sshd (the bot's commands): privilege separation, its children
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID
            - SYS_CHROOT
            - KILL
            - NET_BIND_SERVICE
            - NET_ADMIN
            - NET_RAW
        mem_limit: 128m
        pids_limit: 200
        build:
            dockerfile: dockerfile/wireguard.dockerfile
            args:
                image: ${IMAGE}
        sysctls:
            - net.ipv4.conf.all.src_valid_mark=1
        devices:
            - /dev/net/tun:/dev/net/tun
        volumes:
            # shell profile, sshd and php configs; start scripts (read-only)
            - ./system:/system:ro
            - ./scripts:/scripts:ro
            - ./sshpub:/ssh:ro
            - ./sshhost/wp:/etc/ssh/pinned:ro
            - warp:/etc/warp
        hostname: warp
        container_name: warp-${VER}
        restart: unless-stopped
        command: ["/bin/sh", "/scripts/start_wp.sh"]
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        working_dir: /etc/warp
        networks:
            default:
                ipv4_address: 10.10.0.13
        logging: *default-logging
    dnstt:
        # built on GitHub (scripts/images.sh), or here from the build section below
        image: ${IMAGES:-ghcr.io/umnya-is-a-god/botlight}-dnstt:${IMAGE_TAG:-main}
        security_opt:
            - no-new-privileges:true
        # nothing by default, only what the container needs
        cap_drop:
            - ALL
        cap_add:
            # sshd (the bot's commands): privilege separation, its children
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETGID
            - SETUID
            - SYS_CHROOT
            - KILL
            - NET_BIND_SERVICE
            - NET_ADMIN
        mem_limit: 128m
        pids_limit: 200
        build:
            dockerfile: dockerfile/dnstt.dockerfile
            args:
                image: ${IMAGE}
        volumes:
            # shell profile, sshd and php configs; start scripts (read-only)
            - ./system:/system:ro
            - ./scripts:/scripts:ro
            - ./sshpub:/ssh:ro
            - ./logs:/logs
            - ./sshhost/dnstt:/etc/ssh/pinned:ro
            - ./data/dnstt:/dnstt
        hostname: dnstt
        container_name: dnstt-${VER}
        restart: unless-stopped
        depends_on:
            php:
                condition: service_healthy
        env_file:
            - path: ./.env
              required: true # default
            - path: ./override.env
              required: false
        stop_grace_period: 1s
        command: ["/bin/sh", "/scripts/start_dnstt.sh"]
        # iptables: keeps tunnel users out of internal networks: NET_ADMIN
        networks:
            default:
                ipv4_address: 10.10.0.16
        logging: *default-logging