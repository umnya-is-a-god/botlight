user nginx;
worker_processes auto;

error_log /logs/nginx_error;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_names_hash_bucket_size 64;
    server_tokens off;
    # client address only: request paths of the bot's locations carry secrets
    # (path hash, user ids, Telegram sign-in data, DNS names)
    log_format ip_only '$remote_addr [$time_local] $status';
    # TLS 1.2+ only; no session tickets (their key would let old sessions be
    # decrypted later)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    # absolute paths: nginx runs with -c /etc/nginx/bot/nginx.conf
    include /etc/nginx/user/override.conf;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Proxy Cache storage - so we can cache the DoH response from the upstream
    proxy_cache_path /var/cache/nginx/doh_cache levels=1:2 keys_zone=doh_cache:10m;

    real_ip_header proxy_protocol;
    real_ip_recursive on;
    set_real_ip_from 10.10.0.10;

    server {
        listen 80 default_server;

        location / {
            return 301 https://$host$request_uri;
        }
        location ~\.well-known {
            access_log /logs/nginx_certbot_access;
            root /certs/;
            try_files $uri =404;
        }
    }

    server {
        listen 10.10.0.2:443 ssl http2 proxy_protocol default_server;
        listen 10.10.1.2:443 ssl http2 default_server;
        ssl_certificate /certs/self_public;
        ssl_certificate_key /certs/self_private;

        access_log /logs/nginx_default_access;

        location = / {
            # the cover page set in the bot (./data/www/override.html)
            root /www;
            try_files /override.html @auth;
        }

        location /override/ {
            alias /app/override/;
            try_files $uri =404;
        }

        location / {
            root /app;
            auth_basic "Restricted Content";
            auth_basic_user_file /app/.htpasswd;
            try_files $uri =404;
        }
        location @auth {
            root /app;
            auth_basic "Restricted Content";
            auth_basic_user_file /app/.htpasswd;
            try_files $uri =404;
        }


        location @php {
            # /webapp...?<initData>: the admin's Telegram sign-in, never logged
            access_log off;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param SERVER_NAME $host;
            fastcgi_read_timeout 300s;
            # the Mini App pool (system/php-fpm.conf)
            fastcgi_pass php:9001;
        }

        location /adguard/ {
        }

        location = /webapp {
            return 301 /webapp/;
        }
        location /webapp/ {
            # trailing slashes on both sides: without them a longer path
            # would be mapped next to the web root instead of inside it
            access_log off;
            alias /app/;
            index index.html;
            try_files $uri $uri/ @php;
        }

        location ~ /\. {
            # no dotfiles (.htpasswd and the like) from any location
            deny all;
        }

        location /pac {
            access_log off;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param SERVER_NAME $host;
            fastcgi_read_timeout 300s;
            fastcgi_pass php:9000;
        }

        location /ws {
            proxy_pass http://xr:443;
            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 5d;
        }

        location /dns-query {
            access_log /logs/nginx_doh_access ip_only;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $remote_addr;
            proxy_cache doh_cache;
            proxy_cache_key $scheme$proxy_host$uri$is_args$args$request_body;
            proxy_pass https://ad/dns-query;
        }
        include /etc/nginx/user/location.conf;
    }

