; PHP-FPM pool for the bot web endpoints (subscriptions, PAC, webapp).
; nginx in the ng container sends every request to /app/index.php.
[www]
; the bot writes /config, /certs and runs git/ssh as root, like NGINX Unit did
user = root
group = root
listen = 9000
; FastCGI has no authentication: accept connections only from nginx (ng)
listen.allowed_clients = 10.10.0.2
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
; keep IP, VER and other container env for getenv()
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
; no access log: request URIs carry the path hash and user ids
