# Checks on every push and pull request: PHP syntax and static analysis,
# shell scripts, Dockerfiles, the compose file, the config templates and
# the tests in tests/. The tools are fixed releases, checked by SHA-256.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: php -l
        run: |
          php --version
          for f in app/*.php app/bot/*.php tests/*.php; do php -l "$f" > /dev/null || exit 1; done
      - name: PHPStan
        run: |
          curl -sSfLo phpstan.phar https://github.com/phpstan/phpstan/releases/download/2.3.4/phpstan.phar
          echo "a961d12cc71941a31ad6560e6a330347d487612628c3202a718f71a59de21a7c  phpstan.phar" | sha256sum -c -
          php -d memory_limit=2G phpstan.phar analyse --no-progress

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck scripts/*.sh tests/*.sh

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: config templates parse
        run: |
          for f in config/*.json; do
            php -r 'json_decode(file_get_contents($argv[1]), false, 512, JSON_THROW_ON_ERROR);' "$f" || exit 1
          done
          python3 -c 'import yaml' 2> /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
          python3 -c 'import sys, yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]' config/*.yaml
      - name: Mini App sign-in
        run: php tests/webapp_auth_test.php
      - name: admins
        run: |
          # the bot's data folder is /data
          sudo mkdir /data && sudo chown "$(id -u)" /data
          php tests/auth_test.php
      - name: update.sh
        run: |
          bash tests/update_sh_test.sh
          bash tests/update_apply_test.sh
      - name: release.sh
        run: bash tests/release_test.sh
      - name: warp_profile.sh
        run: bash tests/warp_profile_test.sh

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: hadolint
        run: |
          curl -sSfLo hadolint https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-Linux-x86_64
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  hadolint" | sha256sum -c -
          chmod +x hadolint
          ./hadolint dockerfile/*.dockerfile
      - name: docker compose config
        run: |
          # the files COMPOSE_FILE (.env) lists, made by make start on a server
          touch docker-compose.ports.yml docker-compose.override.yml
          docker compose config -q
