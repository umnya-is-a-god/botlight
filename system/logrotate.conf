# Logs of all containers (./logs), rotated by the cron loop (service):
# once a day or above 50 MB, kept for 7 rotations (a week), older ones
# compressed. copytruncate: nginx, Xray and the IP limit loop keep writing
# into the file they have open. The pattern leaves out the rotated copies
# (name.1, name.2.gz).
/logs/*[!0-9z] {
    daily
    maxsize 50M
    rotate 7
    missingok
    notifempty
    copytruncate
    compress
    delaycompress
}
