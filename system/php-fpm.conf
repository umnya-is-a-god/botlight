; PHP-FPM for the bot's web endpoints; nginx (ng) sends every request to
; /app/index.php. The master runs as root only to start the pools; the
; pools run as unprivileged users (dockerfile/php.dockerfile) and cannot
; read the bot token, the SSH key or the TLS keys.
[global]
error_log = /logs/php_fpm_error
daemonize = no

; public endpoints: subscriptions, PAC, rule-sets (/pac...)
[www]
user = botweb
group = botweb
listen = 9000
; FastCGI has no authentication: accept connections only from nginx (ng)
listen.allowed_clients = 10.10.0.2
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
; keep IP, VER and other container env for getenv()
clear_env = no
env[BOT_POOL] = public
catch_workers_output = yes
decorate_workers_output = no
; worker errors: a pool user cannot open php.ini's error_log
; (/logs/php_error, root), so PHP hands them to php-fpm, which writes them
; into the error_log above
; no access log: request URIs carry the path hash and user ids

; the admin's Mini App (/webapp...): Telegram sign-in checked on every
; request; also in the group of /data/secrets
[admin]
user = botadmin
group = botadmin
listen = 9001
listen.allowed_clients = 10.10.0.2
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 60s
pm.max_requests = 200
clear_env = no
env[BOT_POOL] = admin
catch_workers_output = yes
decorate_workers_output = no
